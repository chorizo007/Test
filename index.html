<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Temario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Pantalla de inicio con los botones principales -->
        <div id="main-menu">
            <h1>Selecciona una opción</h1>
            <div class="menu-buttons">
                <button id="btn-comun">Parte Común</button>
                <button id="btn-especifica">Parte Específica</button>
                <button id="btn-general">Test General (Examen)</button>
            </div>
        </div>

        <div id="topic-menu" class="hidden">
            <div id="topic-header">
                <h1 id="topic-menu-title">Parte Común</h1>
                <button id="btn-topics-back">Volver</button>
            </div>
            <div id="topic-buttons" class="topic-buttons"></div>
            <p id="topic-empty" class="hidden">Todavía no hay tests disponibles en esta sección.</p>
        </div>

        <!-- Contenedor para mostrar los test -->
        <div id="test-container" class="hidden">
            <div id="test-header">
                <h2 id="test-title">Título del Test</h2>
                <button id="btn-back">Volver</button>
            </div>
            <div id="question-area">
                <p id="progress">Pregunta 1 de 10</p>
                <h3 id="question-text">Texto de la pregunta</h3>
                <div id="options-container"></div>
            </div>
            <div id="test-footer">
                <button id="btn-next" class="hidden">Siguiente Test</button>
                <button id="btn-check">Comprobar Respuesta</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
